# =============================================================================
# Docker Compose — RobotUniversityGiar swap_experiment.py
# =============================================================================
# This service builds and immediately starts the policy-switching demo.
# No manual commands are required after `docker compose up`.
#
# Quick start:
#   1. Put your .pt checkpoint files in a ./policies/ folder next to this
#      file (e.g. ./policies/motion.pt).
#   2. Launch:
#        docker compose up --build
#   3. Open the viser viewer at http://localhost:9006
#      and the unified control web at http://localhost:9013
#
# Override policy paths or backend via a .env file or CLI flags:
#   GENESIS_BACKEND=cuda docker compose up
#
# Headless smoke test (no browser):
#   docker compose run --rm -e HEADLESS=1 leggedgym
#
# GPU host (Linux + NVIDIA + nvidia-container-runtime installed):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Training inside the container (uses NUM_ENVS from .env):
#   docker compose run --rm leggedgym python -m legged_gym.scripts.train --task go2 --num_envs $NUM_ENVS
#
# NOTE: the NVIDIA `deploy.resources.reservations.devices` block is NOT safe
# to leave in this base file — unlike the Swarm-only `deploy` keys Compose V2
# otherwise ignores outside a stack deploy, this one is honored by
# `docker compose up`/`run`, and it hard-fails container creation with
# "could not select device driver nvidia" on any host without that driver
# (Apple Silicon/Colima, plain Linux without a GPU, CI, etc). It lives in the
# optional docker-compose.gpu.yml overlay instead, so this base file runs
# anywhere.
# =============================================================================

services:
  leggedgym:
    build:
      context: .
      dockerfile: Dockerfile
    image: robotuniversitygiar:genesis
    container_name: leggedgym-swap-experiment

    # Mount the policies directory into the repo path expected by
    # TrainingManager.discover_local_policies() (POLICIES_DIR = REPO_ROOT / "policies").
    # Read-only is safe: the driver never writes here.
    volumes:
      - ./policies:/workspace/RobotUniversityGiar/policies:ro

    working_dir: /workspace/RobotUniversityGiar

    environment:
      SIMULATOR: genesis
      # Genesis backend: "cuda" for GPU (falls back to CPU if unavailable),
      # or "cpu" to force CPU-only mode.  Override in .env or via shell:
      #   GENESIS_BACKEND=cuda docker compose up
      GENESIS_BACKEND: ${GENESIS_BACKEND:-cpu}
      # Which policy starts active.  Must match a discovered .pt filename
      # (without extension).  Defaults to the first policy alphabetically.
      ACTIVE_POLICY: ${ACTIVE_POLICY:-}
      # Network ports exposed to the host.  Change in .env if defaults collide
      # with another service.
      CONTROL_PORT: ${CONTROL_PORT:-9013}
      VISER_PORT: ${VISER_PORT:-9006}
      # Set to 1 for a headless smoke test (no web viewer).
      HEADLESS: ${HEADLESS:-0}
      # Playback speed multiplier (1.0 = real-time 50 Hz).
      SPEED: ${SPEED:-0.35}
      # GPU selection — restricts which host GPU(s) the container sees.
      # Only effective when the GPU overlay is applied (docker-compose.gpu.yml).
      NVIDIA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      # Default number of parallel envs for manual training commands inside
      # the container (e.g. docker compose run --rm leggedgym python -m ...).
      NUM_ENVS: ${NUM_ENVS:-2048}

    ports:
      - "${VISER_PORT:-9006}:${VISER_PORT:-9006}"   # viser 3-D viewer
      - "${CONTROL_PORT:-9013}:${CONTROL_PORT:-9013}"   # unified control web

    stdin_open: true
    tty: true
