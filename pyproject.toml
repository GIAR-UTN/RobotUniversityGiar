[project]
name = "RobotUniversityGiar"
version = "0.4.0"
requires-python = ">=3.8"
dependencies = [
                'matplotlib',
                'tensorboard',
                'xlsxwriter',
                'pandas',
                'wandb',
                'tqdm',
                'scipy',
                'torch',
                'torchvision',
                'numpy',
                'pygame',
                'trimesh',
                'rich-argparse',
                'viser',
                'fastapi',
                'uvicorn',
                'onnxruntime'
]

[project.scripts]
rugiar = "legged_gym.cli.rugiar:main"

[project.optional-dependencies]
isaacgym = [
    # torch/torchvision deliberately NOT pinned here: "+cu121" local-version
    # wheels don't exist on PyPI, only on download.pytorch.org/whl/cu121, so
    # a plain `pip install -e .[isaacgym]` against the default index always
    # hits ResolutionImpossible on this pin. Install torch from that index
    # explicitly BEFORE this extra (see kaggle_backend.py's gpu_lines for
    # the Genesis-path precedent, and the colleague's proven Kaggle recipe
    # this mirrors) -- one place owns the torch pin, the place that knows
    # the target hardware.
    "numpy==1.24.1",
    "pandas==2.0.3",
    "scipy==1.10.1",
    "matplotlib==3.7.5",
    "fsspec<=2025.3.0",  # fsspec==2025.3.1 has bug with python 3.8
    "isaacgym==1.0rc4",
    "onnx>=1.17.0",
    "protobuf==4.25.0",
    "warp-lang==1.10.1",
]
genesis = [
    "genesis-world==1.0.0",
    'warp-lang'
]
isaaclab = [
    "warp-lang==1.12.0",
]
cloud = [
    "kaggle",
]
mcp = [
    "mcp>=1.0.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]
mjlab = [
    # NOTE: install into a SEPARATE venv (.venv-mjlab), never this repo's
    # main .venv, and always invoke that venv's python with `-I` (isolated
    # mode). Two hard collisions otherwise: this repo vendors a top-level
    # `rsl_rl/` package (see [tool.setuptools] packages below) which
    # shadows PyPI `rsl-rl-lib` (installs as `rsl_rl` too) whenever the
    # repo root ends up on sys.path -- confirmed on this machine: a plain
    # `python -c` run from the repo root resolves rsl_rl to the vendored
    # copy even inside .venv-mjlab; `python -I` fixes it. Second: `genesis`
    # above pulls mujoco==3.10.0, mjlab needs mujoco~=3.11.0. See
    # docs/mjlab_migration.md R1.
    "mjlab==1.6.0",
    "onnxruntime>=1.19",
]

[tool.setuptools]
packages = ['rsl_rl', 'resources', 'legged_gym']
