[project]
name = "RobotUniversityGiar"
version = "0.4.0"
requires-python = ">=3.8"
dependencies = [
                'matplotlib',
                'tensorboard',
                'xlsxwriter',
                'pandas',
                'wandb',
                'tqdm',
                'scipy',
                'torch',
                'torchvision',
                'numpy',
                'pygame',
                'trimesh',
                'rich-argparse',
                'viser',
                'fastapi',
                'uvicorn',
                'onnxruntime'
]

[project.optional-dependencies]
isaacgym = [
    # torch/torchvision deliberately NOT pinned here: "+cu121" local-version
    # wheels don't exist on PyPI, only on download.pytorch.org/whl/cu121, so
    # a plain `pip install -e .[isaacgym]` against the default index always
    # hits ResolutionImpossible on this pin. Install torch from that index
    # explicitly BEFORE this extra (see kaggle_backend.py's gpu_lines for
    # the Genesis-path precedent, and the colleague's proven Kaggle recipe
    # this mirrors) -- one place owns the torch pin, the place that knows
    # the target hardware.
    "numpy==1.24.1",
    "pandas==2.0.3",
    "scipy==1.10.1",
    "matplotlib==3.7.5",
    "fsspec<=2025.3.0",  # fsspec==2025.3.1 has bug with python 3.8
    "isaacgym==1.0rc4",
    "onnx>=1.17.0",
    "protobuf==4.25.0",
    "warp-lang==1.10.1",
]
genesis = [
    "genesis-world==1.0.0",
    'warp-lang'
]
isaaclab = [
    "warp-lang==1.12.0",
]
cloud = [
    "kaggle",
]

[tool.setuptools]
packages = ['rsl_rl', 'resources', 'legged_gym']
